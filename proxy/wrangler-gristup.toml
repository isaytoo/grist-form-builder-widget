name             = "grist-form-proxy-gristup"
main             = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# URL de l'instance Grist self-hosted (sans slash final)
GRIST_URL = "https://grist.gristup.fr"

# Origins autorisées (séparées par virgule)
ALLOWED_ORIGINS = "*.github.io,*.getgrist.com,*.gristup.fr,https://isaytoo.github.io"

# Rate limiting : max soumissions par IP par fenêtre de temps
RATE_LIMIT_MAX = "30"           # 30 soumissions max
RATE_LIMIT_WINDOW_MS = "60000"  # par minute

# ─────────────────────────────────────────────────────────────────
# Secrets à définir via :
#   wrangler secret put GRIST_API_KEY -c wrangler-gristup.toml
# ─────────────────────────────────────────────────────────────────
#
# Clé API Grist self-hosted avec droit d'écriture :
#   1. Dans grist.gristup.fr → Profil → Paramètres → Clés API
#   2. Créer une nouvelle clé avec accès au document
#
